name: fuzz

# Each night, and by hand: a refresh of the corpus cache that test.yml's Compare and Perf jobs read (the
# corpus-cache job below), and long runs of the randomized tests with a new seed: the differential fuzz test
# (test/fuzz.test.js), the property tests (test/properties.test.js) and the growth test (test/growth.timing.js).
# Pull requests run them in npm test with a fixed seed and fewer cases. A failure keeps its seed in the log and in
# an artifact: replay it with the command in replay.txt, and add the shrunk counterexample to the regressions of
# the property.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Seed (empty for a new one)
        required: false
        default: ''
      scale:
        description: Run counts times this (100 is about five million fuzz strings)
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pick the seed
        id: seed
        shell: bash
        env:
          SEED: ${{ inputs.seed }}
        run: echo "seed=${SEED:-$(( (RANDOM << 15) | RANDOM ))}" >> "$GITHUB_OUTPUT"
      - name: Fuzz and property tests
        shell: bash
        env:
          KNAYI_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          KNAYI_FUZZ_SCALE: ${{ inputs.scale || '100' }}
        run: |
          echo "KNAYI_FUZZ_SEED=$KNAYI_FUZZ_SEED KNAYI_FUZZ_SCALE=$KNAYI_FUZZ_SCALE npm run test:fuzz" | tee replay.txt
          npm run test:fuzz 2>&1 | tee fuzz.log
      # 500 random cases per call form (pull requests run 10), about 75 s.
      - name: Growth test
        if: success() || failure()
        shell: bash
        env:
          KNAYI_GROWTH_SEED: ${{ steps.seed.outputs.seed }}
          KNAYI_GROWTH_RUNS: '500'
        run: |
          echo "KNAYI_GROWTH_SEED=$KNAYI_GROWTH_SEED KNAYI_GROWTH_RUNS=$KNAYI_GROWTH_RUNS node --test test/growth.timing.js" | tee -a replay.txt
          node --test test/growth.timing.js 2>&1 | tee growth.log
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-${{ steps.seed.outputs.seed }}
          path: |
            replay.txt
            fuzz.log
            growth.log

  # Keeps the corpus cache that test.yml's Compare and Perf jobs read warm and working. GitHub evicts a cache
  # unused for 7 days, a fill on a push to main can fail, and a change upstream can make every fill fail; in each
  # case compare would quietly run offline. A scheduled run uses main's cache scope: restoring marks the cache used,
  # and a miss (an eviction, or new pins in scripts/eval/datasets.mjs) fills and saves it again. A failed fill fails
  # this job, so the nightly run shows it.
  corpus-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Restore the corpus cache
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .eval-cache/data
            !.eval-cache/data/mc4.gz
            !.eval-cache/data/queries.tsv
            !.eval-cache/data/flores.gz
          key: corpus-${{ hashFiles('scripts/eval/datasets.mjs') }}
      - name: Fill the corpus cache
        id: fill
        if: steps.corpus.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: node scripts/eval/datasets.mjs --fetch --without mc4
      - name: Save the corpus cache
        if: steps.fill.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .eval-cache/data
            !.eval-cache/data/mc4.gz
            !.eval-cache/data/queries.tsv
            !.eval-cache/data/flores.gz
          key: corpus-${{ hashFiles('scripts/eval/datasets.mjs') }}
      - name: Check the corpus cache
        run: node scripts/eval/datasets.mjs --check
