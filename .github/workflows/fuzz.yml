name: fuzz

# Long runs of the randomized tests with a new seed each night: the differential fuzz test (test/fuzz.test.js),
# the property tests (test/properties.test.js) and the growth test (test/growth.test.js). Pull requests run them
# in npm test with a fixed seed and fewer cases. A failure keeps its seed in the log and in an artifact: replay it
# with the command in replay.txt, and add the shrunk counterexample to the regressions of the property.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Seed (empty for a new one)
        required: false
        default: ''
      scale:
        description: Run counts times this (100 is about five million fuzz strings)
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pick the seed
        id: seed
        shell: bash
        env:
          SEED: ${{ inputs.seed }}
        run: echo "seed=${SEED:-$(( (RANDOM << 15) | RANDOM ))}" >> "$GITHUB_OUTPUT"
      - name: Fuzz and property tests
        shell: bash
        env:
          KNAYI_FUZZ_SEED: ${{ steps.seed.outputs.seed }}
          KNAYI_FUZZ_SCALE: ${{ inputs.scale || '100' }}
        run: |
          echo "KNAYI_FUZZ_SEED=$KNAYI_FUZZ_SEED KNAYI_FUZZ_SCALE=$KNAYI_FUZZ_SCALE npm run test:fuzz" | tee replay.txt
          npm run test:fuzz 2>&1 | tee fuzz.log
      # 500 random cases per call form (pull requests run 10), about 75 s.
      - name: Growth test
        if: success() || failure()
        shell: bash
        env:
          KNAYI_GROWTH_SEED: ${{ steps.seed.outputs.seed }}
          KNAYI_GROWTH_RUNS: '500'
        run: |
          echo "KNAYI_GROWTH_SEED=$KNAYI_GROWTH_SEED KNAYI_GROWTH_RUNS=$KNAYI_GROWTH_RUNS node --test test/growth.test.js" | tee -a replay.txt
          node --test test/growth.test.js 2>&1 | tee growth.log
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-${{ steps.seed.outputs.seed }}
          path: |
            replay.txt
            fuzz.log
            growth.log
