name: test

on:
  push:
  pull_request:

# The jobs only read the repository. Each action is pinned to a full commit SHA, with its version in a comment;
# Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push. Other runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds dist into a temporary directory and tests that build, then type-checks typecheck/.
      - run: npm test
      # test/syntax.test.js is the ES2015 gate for every dist file (one test each); it must run, not be skipped.
      - name: Check the syntax test ran
        run: node scripts/check-tests-ran.mjs --min 4 test/syntax.test.js

  bun:
    name: Bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: npm run test:bun
      - run: npm run test:pack

  # Placeholders for jobs still to be wired in when their scripts land. Pin every action they add by SHA, and keep
  # them read-only.
  #
  # compare: two-copy output comparison against the base branch, on main.js and on the .mjs and min.js builds
  #   made in a temporary directory, under Node and Bun. Needs the base ref (fetch-depth: 0, as in the dist job)
  #   and the corpus cache, restored with actions/cache keyed on scripts/eval/datasets.mjs. Fork pull requests
  #   run with --offline (generated inputs only). The cache must never hold mC4 or queries.tsv.
  #     run: npm run compare -- --base "origin/$GITHUB_BASE_REF"
  #
  # matrix: the API contract matrix on main.js, the .mjs build and min.js, under Node and Bun.
  #
  # browser: the dist token and built-in denylist for the README browser floor, and the Playwright smoke run of
  #   min.js with the README examples in Chromium, Firefox and WebKit. Install the browsers with
  #   `npx playwright install --with-deps chromium firefox webkit`, and cache ~/.cache/ms-playwright keyed on the
  #   @playwright/test version.
  #
  # redos: recheck over every regular expression the library ships.
  #
  # perf: growth exponents on the adversarial inputs (blocking above 1.3), and Node rows slower than the
  #   threshold set from an A/A run on GitHub runners.
